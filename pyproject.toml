[build-system]
requires = ["setuptools >= 77.0.3"]

build-backend = "setuptools.build_meta"

[project]
name = "memprod"
version = "0.2.1"
authors = [{name = "Matyas Parrag",email="matyas.parrag@gmail.com"}]
description = "A program for the prediction of local membrane deformations around a protein"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mempro >= 0.2.1","scipy >= 1.11.3"]
classifiers = ["Programming Language :: Python :: 3"]
license = "GPL-3.0"
license-files = ["LICEN[CS]E*"]

[project.optional-dependencies]
# NVIDIA GPU support for the MemPrO parts (Linux, CUDA 12)
gpu = ["mempro[gpu] >= 0.2.1"]

[project.scripts]
MemPrOD = "memprod:MemPrOD.main"

[project.urls]
Homepage = "https://github.com/pstansfeld/MemPrOD"
Issues = "https://github.com/pstansfeld/MemPrOD/issues"
